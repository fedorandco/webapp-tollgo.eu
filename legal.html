<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informații juridice – tollgo.eu</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --primary: #13294b; --accent: #1a73e8; --bg: #f5f7fa; --text: #1d2433; --muted: #5b6475; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    header { background: var(--primary); color: #fff; padding: 14px 16px; }
    header .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    header a { color: #dbe4f5; text-decoration: none; }
    .lang-btn { background: transparent; border: 1px solid #3b4f73; color: #dbe4f5; border-radius: 6px; padding: 3px 10px; font: inherit; cursor: pointer; }
    .lang-btn.active { background: #fff; color: var(--primary); border-color: #fff; font-weight: 700; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
    nav.toc { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 24px 0 8px; font-size: 0.95rem; }
    nav.toc a { color: var(--accent); }
    section { background: #fff; border-radius: 12px; padding: 20px 24px; margin: 16px 0; box-shadow: 0 2px 6px rgba(0,0,0,.08); scroll-margin-top: 16px; }
    h1 { color: var(--primary); margin: 28px 0 4px; }
    h2 { color: var(--primary); margin: 0 0 10px; font-size: 1.25rem; }
    li { margin-bottom: 6px; }
    a { color: var(--accent); }
    .banner { background: #fff8e1; border: 1px solid #f0d878; border-radius: 10px; padding: 12px 16px; margin: 16px 0; font-size: 0.93rem; }
    .note { color: var(--muted); font-size: 0.88rem; }
    mark.todo { background: #fde68a; color: #5b3b00; padding: 0 4px; border-radius: 4px; }
    footer { margin: 32px 0; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a id="back" href="index.html">← Înapoi la site</a>
      <div role="group" aria-label="Language">
        <button type="button" class="lang-btn" data-lang="ro">RO</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <h1 id="title"></h1>
    <p class="note" id="langNote"></p>
    <div class="banner" id="banner" hidden></div>
    <nav class="toc" id="toc"></nav>
    <div id="sections"></div>
  </main>

  <footer class="wrap"><a id="back2" href="index.html"></a></footer>

  <script src="legal/company.js"></script>
  <script src="legal/content.js"></script>
  <script>
    (function () {
      const { LEGAL, fill, esc } = window.TollgoLegal;
      const company = window.TOLLGO_COMPANY || {};

      // Limba: cea aleasă pe site; orice limbă fără traducere juridică folosește engleza.
      function pickLang() {
        let saved = null;
        try { saved = localStorage.getItem("tollgo_lang"); } catch (e) {}
        const l = saved || (navigator.language || "en").slice(0, 2).toLowerCase();
        return LEGAL[l] ? l : "en";
      }
      let lang = pickLang();

      function render() {
        const c = LEGAL[lang];
        document.documentElement.lang = lang;
        document.title = c.pageTitle;
        document.getElementById("title").textContent = c.pageTitle.split(" – ")[0];
        document.getElementById("langNote").textContent = c.langNote;
        document.getElementById("back").textContent = c.back;
        document.getElementById("back2").textContent = c.back;
        const banner = document.getElementById("banner");
        banner.hidden = !!company.reviewed;
        banner.textContent = c.draftBanner;
        document.getElementById("toc").innerHTML = c.sections.map(s => `<a href="#${s.id}">${esc(s.title)}</a>`).join("");
        document.getElementById("sections").innerHTML = c.sections.map(s =>
          `<section id="${s.id}"><h2>${esc(s.title)}</h2>${fill(s.html, company, lang)}</section>`).join("");
        document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
        // revenire la secțiunea din adresă după (re)randare
        if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
      }

      document.querySelectorAll(".lang-btn").forEach(b => b.addEventListener("click", () => {
        lang = b.dataset.lang;
        try { localStorage.setItem("tollgo_lang", lang); } catch (e) {}
        render();
      }));
      render();
    })();
  </script>
</body>
</html>
